<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1" name="viewport" />
        <title>New Inquiry</title>
    </head>
    <body style="background-color: #f7f8fa; font-family: 'Schibsted Grotesk', system-ui, sans-serif; margin: 0; padding: 0">
        <table
            cellpadding="0"
            cellspacing="0"
            role="presentation"
            style="background-color: #f7f8fa"
            width="100%"
        >
            <tr>
                <td style="padding: 32px 16px">
                    <table
                        cellpadding="0"
                        cellspacing="0"
                        role="presentation"
                        style="margin: 0 auto; max-width: 600px"
                        width="100%"
                    >
                        <tr>
                            <td style="background-color: #0f1115; border-radius: 8px 8px 0 0; padding: 28px 32px">
                                <h1 style="color: #ffffff; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin: 0">New Inquiry</h1>
                            </td>
                        </tr>
                        <tr>
                            <td style="background-color: #ffffff; border-bottom: 1px solid #eef0f3; padding: 24px 32px 20px">
                                <p style="color: #626770; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; margin: 0 0 12px; text-transform: uppercase">Contact</p>
                                <table
                                    cellpadding="0"
                                    cellspacing="0"
                                    role="presentation"
                                    width="100%"
                                >
                                    <tr>
                                        <td style="color: #626770; font-size: 16px; padding: 6px 12px 6px 0; vertical-align: top; white-space: nowrap">Name</td>
                                        <td style="color: #20242c; font-size: 16px; padding: 6px 0; word-break: break-word">{{name}}</td>
                                    </tr>
                                    <tr>
                                        <td style="color: #626770; font-size: 16px; padding: 6px 12px 6px 0; vertical-align: top; white-space: nowrap">Email</td>
                                        <td style="color: #20242c; font-size: 16px; padding: 6px 0; word-break: break-word"><a href="mailto:{{email}}" style="color: #6366f1; text-decoration: none">{{email}}</a></td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                        <tr>
                            <td style="background-color: #ffffff; border-radius: 0 0 8px 8px; padding: 20px 32px 28px">
                                <p style="color: #626770; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; margin: 0 0 12px; text-transform: uppercase">Message</p>
                                <p style="color: #20242c; font-size: 16px; line-height: 1.6; margin: 0; white-space: pre-wrap">{{message}}</p>
                            </td>
                        </tr>
                        <tr>
                            <td style="padding: 20px 32px 0; text-align: center">
                                <a
                                    href="https://dev.aephonics.com"
                                    style="color: #626770; font-size: 12px; text-decoration: none"
                                >Kevin Huang</a>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
